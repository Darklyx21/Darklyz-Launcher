
name: Darklyz Launcher - Android CI

on:
  push:
    branches:
      - darklyz-launcher

  pull_request:
    branches:
      - darklyz-launcher

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # 2. INSTALAR ANDROID SDK
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.3.13750724'

      # ============================================================
      # 3. COMPATIBILIDAD CON ANDROID SDK 37
      # Android publica esta plataforma en android-37.0.
      # Algunas versiones de Gradle/AGP buscan android-37.
      # ============================================================
      - name: Fix Android 37 SDK path compatibility
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM_DIR="${SDK}/platforms"

          echo "Android SDK: ${SDK}"

          if [ ! -d "${PLATFORM_DIR}/android-37.0" ]; then
            echo "::error::Android SDK Platform 37.0 was not installed."
            echo "Available platform directories:"

            if [ -d "${PLATFORM_DIR}" ]; then
              ls -la "${PLATFORM_DIR}"
            fi

            exit 1
          fi

          rm -rf "${PLATFORM_DIR}/android-37"
          cp -a "${PLATFORM_DIR}/android-37.0" "${PLATFORM_DIR}/android-37"
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/g' "${PLATFORM_DIR}/android-37/source.properties"
          sed -i '/AndroidVersion.ApiMinorLevel/d' "${PLATFORM_DIR}/android-37/source.properties"
          if [ -f "${PLATFORM_DIR}/android-37/package.xml" ]; then
            sed -i 's/platforms;android-37.0/platforms;android-37/g' "${PLATFORM_DIR}/android-37/package.xml"
            sed -i 's/<api-level>37.0<\/api-level>/<api-level>37<\/api-level>/g' "${PLATFORM_DIR}/android-37/package.xml"
          fi
          echo "Compatibility platform android-37 created and patched." 

          ls -ld \
            "${PLATFORM_DIR}/android-37.0" \
            "${PLATFORM_DIR}/android-37"

      # ============================================================
      # 4. DESCARGAR EL JRE 8 DEL PROYECTO POJAVLAUNCHER
      # ============================================================
      - name: Download Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
          path: app_pojavlauncher/src/main/assets/components/jre

      # ============================================================
      # 5. CONFIGURAR GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      # ============================================================
      # 6. PREPARAR EL PROYECTO
      # ============================================================
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/languagelist_updater.sh

          mkdir -p out

      # ============================================================
      # 7. COMPILAR EL APK DEBUG
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app_pojavlauncher:assembleDebug

          APK_PATH="app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"

          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::The APK was not generated or is empty."
            exit 1
          fi

          cp \
            "${APK_PATH}" \
            out/Darklyz-Launcher-debug.apk

          md5sum \
            out/Darklyz-Launcher-debug.apk \
            > out/Darklyz-Launcher-debug.md5

          echo "APK generated successfully."
          ls -lh out/Darklyz-Launcher-debug.*

      # ============================================================
      # 8. PUBLICAR EL APK COMO ARTIFACT
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Darklyz-Launcher-debug
          path: out/Darklyz-Launcher-debug.*
          if-no-files-found: error
          retention-days: 7

