name: Darklyz Launcher - Android CI

on:
  push:
    branches:
      - darklyz-launcher
  pull_request:
    branches:
      - darklyz-launcher
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37 build-tools;36.0.0 ndk;27.3.13750724'

      - name: Download Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare project
        run: |
          bash ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace \
            :app_pojavlauncher:assembleDebug

          test -s \
            app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk

          cp \
            app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
            out/Darklyz-Launcher-debug.apk

          md5sum out/Darklyz-Launcher-debug.apk \
            > out/Darklyz-Launcher-debug.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Darklyz-Launcher-debug
          path: out/Darklyz-Launcher-debug.*
          if-no-files-found: error
          retention-days: 7
